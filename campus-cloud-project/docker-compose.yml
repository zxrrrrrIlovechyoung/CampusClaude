services:
  #===============================================================
  #==========================PostgresSQL
  #===============================================================
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campuscloud_net
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  #===============================================================
  #==========================Pgadmin
  #===============================================================
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres-cloud
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - campuscloud_net

  #===============================================================
  #==========================SQLServer
  #===============================================================
  sqlserver-cloud:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: campuscloud-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - campuscloud_net

  #===============================================================
  #==========================Neo4j
  #===============================================================
  neo4j-cloud:
    image: neo4j:5-community
    container_name: campuscloud-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - campuscloud_net

  #===============================================================
  #==========================MongoDB
  #===============================================================
  mongodb-cloud:
    image: mongo:8.0
    container_name: campuscloud-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    networks:
      - campuscloud_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username ${MONGO_INITDB_ROOT_USERNAME} --password ${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


#===============================================================
#==========================volumenes
#===============================================================
volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME}

  pgadmin_data:
    external: true
    name: ${PGADMIN_VOLUME}

  sqlserver_data:
    external: true
    name: ${SQLSERVER_VOLUME}

  neo4j_data:
    external: true
    name: ${NEO4J_VOLUME}

  mongo_data:
    external: true
    name: ${MONGO_VOLUME}

#===============================================================
#==========================RED
#===============================================================
networks:
  campuscloud_net:
    external: true
    name: ${DOCKER_NETWORK}
