services:
  #===============================================================
  #==========================PostgresSQL
  #===============================================================
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campuscloud_net
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  #===============================================================
  #==========================Pgadmin
  #===============================================================
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres-cloud
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - campuscloud_net

  #===============================================================
  #==========================SQLServer
  #===============================================================
  sqlserver-cloud:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: campuscloud-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - campuscloud_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

#===============================================================
#==========================volumenes
#===============================================================
volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME}

  pgadmin_data:
    external: true
    name: ${PGADMIN_VOLUME}

  sqlserver_data:
    external: true
    name: ${SQLSERVER_VOLUME}

#===============================================================
#==========================RED
#===============================================================
networks:
  campuscloud_net:
    external: true
    name: ${DOCKER_NETWORK}
